title: Guardian Cell Diagnostics
views:
- title: Übersicht
  path: overview
  icon: mdi:battery-search
  type: masonry
  cards:
  - type: markdown
    title: Guardian Cell Diagnostics
    content: '**Wissenschaftlich getrennte Zellkonsistenzdiagnostik**

      Die Guardian-Bewertung ist **kein SOH-Prozentwert**. Sie basiert auf phasenbezogener Abweichung der 15 Zellspannungen vom Modulmedian und wird nur zusammen mit der jeweiligen **Confidence** interpretiert.

      Erweiterte Verfahren wie Dynamic Resistance, Capacity Consistency und ICA/DVA werden erst nach ausreichender Validierung der Messdaten aktiviert.

      **UI-Revision 0.4.3:** Diagnoseparameter werden mit Einheit, Stichprobengröße und erklärender ⓘ-Information dargestellt.'
  - type: entities
    title: Pylontech BMS
    show_header_toggle: false
    entities:
    - entity: sensor.guardian_battery_pylontech_bms_soh
      name: Hersteller-SOH
    - entity: sensor.guardian_battery_pylontech_bms_zyklen
      name: BMS-Zyklen
  - type: button
    name: Bewertungslogik
    icon: mdi:information-outline
    show_state: false
    tap_action:
      action: navigate
      navigation_path: /guardian-cell-diagnostics/bewertungslogik
  - type: markdown
    title: Module
    content: Tippe auf ein vorhandenes Modul, um die **15-Zellen-Ansicht** zu öffnen.
