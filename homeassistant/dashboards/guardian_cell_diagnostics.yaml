- title: Bewertungslogik
  path: bewertungslogik
  subview: true
  back_path: /guardian-cell-diagnostics/overview
  type: masonry
  cards:
  - type: markdown
    title: Guardian · Bewertungslogik der Zelldiagnostik
    content: "{% set cfg = 'sensor.guardian_battery_zelldiagnostik_konfiguration' %}\n# Bewertungslogik\nDie Guardian-Zelldiagnostik ist eine **Evidenzbewertung der Zellkonsistenz**. Sie ist **kein SOH-Prozentwert** und leitet aus einer einzelnen Zellspannung keinen Zellschaden ab.\n## 1 · Zuordnung zu Betriebsphasen\nJeder gültige Messpunkt enthält die 15 Zellspannungen eines Moduls, Modulstrom und SOC. Guardian ordnet ihn zunächst einer Stromphase zu:\n- **Laden**, wenn der Strom mindestens\n  **{{ state_attr(cfg, 'charge_current_a') | default('–', true) }} A** beträgt.\n- **Entladen**, wenn der Strom höchstens\n  **−{{ state_attr(cfg, 'discharge_current_a') | default('–', true) }} A** beträgt.\n- Dazwischen liegt die Phase **Ruhe / Rest**.\nZusätzlich kann derselbe Messpunkt einer Spannungs-/SOC-Phase angehören:\n- **Low-SOC**, wenn SOC ≤\n  **{{ state_attr(cfg, 'low_soc_percent') | default('–', true) }} %**\n  oder die mittlere Zellspannung ≤ **3,22 V** ist.\n- **High-SOC**, wenn SOC\
      \ ≥\n  **{{ state_attr(cfg, 'high_soc_percent') | default('–', true) }} %**\n  oder die mittlere Zellspannung ≥ **3,38 V** ist.\n\nEin Messpunkt kann daher beispielsweise gleichzeitig **Entladen + Low-SOC** oder **Laden + High-SOC** sein.\nDie Phase **Rest** wird erfasst und statistisch ausgewertet, ist derzeit aber **nicht statuswirksam**.\n## 2 · Modulmedian und Zellabweichung\nFür jeden gültigen Messpunkt berechnet Guardian den Median der 15 Zellspannungen des Moduls.\nFür jede Zelle gilt:\n**ΔVᵢ = Vᵢ − Median(V₁ … V₁₅)**\nEine negative Abweichung bedeutet, dass die Zelle unter dem Modulmedian liegt; eine positive Abweichung bedeutet, dass sie darüber liegt.\nZusätzlich werden pro Phase der mittlere Spannungsrang sowie Lowest- und Highest-Anteile erfasst. Diese Kennwerte dienen der Diagnosebasis, sind in dieser Version jedoch **noch nicht statuswirksam**.\n## 3 · Phasenbezogene Evidenz\nInnerhalb jeder Phase wird für jede Zelle der **Median ihrer ΔV-Werte** gebildet. Eine Phase\
      \ darf erst für den Status verwendet werden, wenn mindestens\n**{{ state_attr(cfg, 'min_phase_samples') | default('–', true) }} Messpunkte**\nfür diese Phase vorliegen.\nPhasen mit weniger Messpunkten bleiben für die Statusentscheidung in **LERNPHASE**.\n## 4 · Statusgrenzen je Phase\nDie vier statuswirksamen Phasen besitzen getrennte Grenzwerte. Entscheidend ist jeweils der **Betrag der phasenbezogenen medianen Abweichung**.\n**Entladen**   BEOBACHTEN ab **{{ state_attr(cfg, 'discharge_observe_mv') | default('–', true) }} mV** · AUFFÄLLIG ab **{{ state_attr(cfg, 'discharge_warning_mv') | default('–', true) }} mV** · KRITISCH ab **{{ state_attr(cfg, 'discharge_critical_mv') | default('–', true) }} mV**\n**Low-SOC**   BEOBACHTEN ab **{{ state_attr(cfg, 'low_observe_mv') | default('–', true) }} mV** · AUFFÄLLIG ab **{{ state_attr(cfg, 'low_warning_mv') | default('–', true) }} mV** · KRITISCH ab **{{ state_attr(cfg, 'low_critical_mv') | default('–', true) }} mV**\n**Laden**   BEOBACHTEN\
      \ ab **{{ state_attr(cfg, 'charge_observe_mv') | default('–', true) }} mV** · AUFFÄLLIG ab **{{ state_attr(cfg, 'charge_warning_mv') | default('–', true) }} mV** · KRITISCH ab **{{ state_attr(cfg, 'charge_critical_mv') | default('–', true) }} mV**\n**High-SOC**   BEOBACHTEN ab **{{ state_attr(cfg, 'high_observe_mv') | default('–', true) }} mV** · AUFFÄLLIG ab **{{ state_attr(cfg, 'high_warning_mv') | default('–', true) }} mV** · KRITISCH ab **{{ state_attr(cfg, 'high_critical_mv') | default('–', true) }} mV**\nDie Werte oben werden **nicht fest in diese Seite geschrieben**, sondern aus der von Guardian veröffentlichten aktiven Konfiguration gelesen. Werden die Grenzwerte später in der App-Konfiguration verändert, zeigt diese Seite nach der Übernahme der Konfiguration die neuen aktiven Werte.\n## 5 · Bedeutung der Zellstatus\n**LERNPHASE**   Keine statuswirksame Phase besitzt bisher die erforderliche Mindestzahl gültiger Messpunkte.\n**NORMAL**   Mindestens eine statuswirksame Phase\
      \ ist ausreichend belegt und keine dieser Phasen erreicht ihre Grenze für BEOBACHTEN.\n**BEOBACHTEN**   Mindestens eine ausreichend belegte Phase erreicht ihre BEOBACHTEN-Grenze, aber keine ausreichend belegte Phase erreicht eine höhere Statusstufe.\n**AUFFÄLLIG**   Mindestens eine ausreichend belegte Phase erreicht ihre AUFFÄLLIG-Grenze, aber keine ausreichend belegte Phase erreicht KRITISCH.\n**KRITISCH**   Mindestens eine ausreichend belegte Phase erreicht ihre KRITISCH-Grenze.\nSind mehrere Phasen auswertbar, bestimmt zuerst der **schlechteste Phasenstatus** den Zellstatus. Bei gleichem Status ist die Phase mit der größeren absoluten Evidenzabweichung maßgeblich.\n## 6 · Confidence\nDie Confidence beschreibt die **Datenbasis**, nicht die Schwere der Auffälligkeit. Maßgeblich ist die größte Zahl gültiger Messpunkte einer statuswirksamen Phase.\n- **LOW:** unter\n  {{ state_attr(cfg, 'confidence_medium_samples') | default('–', true) }}\n  geeigneten Messpunkten.\n- **MEDIUM:** ab\n\
      \  {{ state_attr(cfg, 'confidence_medium_samples') | default('–', true) }}\n  bis unter\n  {{ state_attr(cfg, 'confidence_high_samples') | default('–', true) }}\n  geeigneten Messpunkten.\n- **HIGH:** ab\n  {{ state_attr(cfg, 'confidence_high_samples') | default('–', true) }}\n  geeigneten Messpunkten.\n\nStatus und Confidence bleiben bewusst getrennt. Eine Zelle kann beispielsweise **KRITISCH + LOW Confidence** oder **BEOBACHTEN + HIGH Confidence** sein.\n## 7 · Modulstatus\nGuardian bewertet zunächst alle 15 Zellen eines vorhandenen Moduls. Der Modulstatus entspricht anschließend dem **schlechtesten Zellstatus**:\n**LERNPHASE < NORMAL < BEOBACHTEN < AUFFÄLLIG < KRITISCH**\nBei gleichem Zellstatus wird die Zelle mit der größeren Evidenzabweichung als auffälligste Zelle geführt. Die Modul-Confidence entspricht der Confidence dieser maßgeblichen Zelle.\n## 8 · Was derzeit nicht statuswirksam ist\nFolgende Informationen können bereits erfasst oder angezeigt werden, bestimmen in dieser\
      \ Version aber **nicht** NORMAL / BEOBACHTEN / AUFFÄLLIG / KRITISCH:\n- Lowest-Anteil und Highest-Anteil - mittlerer Zellrang - einzelne aktuelle Zellabweichung als Momentaufnahme - Zellspreizung als eigenständiges Statuskriterium - historische Median-Rekonstruktion - Dynamic Resistance - Capacity Consistency - Rest-/Relaxationsdrift - ICA/DVA - Balancing als eigenständiges Statuskriterium - Temperatur als eigenständiges Statuskriterium - Hersteller-SOH, Life Warning oder Life Alarm als Zellstatuskriterium\nDiese Größen dürfen später nur mit einer klar definierten und nachvollziehbaren Evidenzlogik in die Bewertung aufgenommen werden.\n## 9 · Grundsatz\nEin einzelner Messwert ist **keine Schadensdiagnose**. Guardian bewertet reproduzierbare, phasenbezogene Abweichungen mit definierter Mindestdatenmenge und weist die Aussagekraft separat über die Confidence aus."
