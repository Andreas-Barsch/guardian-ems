    content: '**Bewertung:** phase-resolved Cell Voltage Consistency.   Die Zellspannung wird relativ zum Median der 15 Zellen desselben Moduls ausgewertet. Tiefbereich, Entladung, Ladung und Hochbereich werden getrennt betrachtet.

      **Nicht zulässig:** Aus einer einzelnen niedrigen oder hohen Zellspannung direkt auf Kapazitätsverlust oder erhöhten Innenwiderstand zu schließen. Diese Aussagen werden erst aktiviert, wenn die dafür vorgesehenen Diagnoseverfahren ausreichend validiert sind.'
