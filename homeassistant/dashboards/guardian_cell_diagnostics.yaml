      ## {% if s == ''NORMAL'' %}🟢{% elif s in [''BEOBACHTEN'',''LERNPHASE'',''NICHT BEWERTBAR''] %}🟡{% else %}🔴{% endif %} {{ s }}

      **Confidence:** {{ conf }}   **Aktuelle Zellspannung:** {{ v }} mV   **Aktuelle Abweichung zum Modulmedian:** {{ d }} mV   **Evidenzabweichung:** {{ e }} mV

      {% if s in [''NICHT BEWERTBAR'',''LERNPHASE''] %} *Noch nicht genügend phasenbezogene Messdaten für einen belastbaren Zellbefund.* {% elif conf == ''LOW'' %} *Vorläufiger Befund: Die Datenmenge ist noch klein. Keine Einzelmaßnahme allein aus diesem Status ableiten.* {% elif conf == ''MEDIUM'' %} *Der Befund ist bereits mehrfach reproduziert, sollte aber weiter beobachtet werden.* {% else %} *Hohe Evidenzbasis: Der Befund wurde über eine große Zahl geeigneter Messpunkte reproduziert.* {% endif %}'
  - type: markdown
    title: Phasenbezogene Evidenz
    content: "{% set low_dev = states('sensor.guardian_battery_modul_1_zelle_1_tiefbereich_abweichung') %}\n{% set low_lowest = states('sensor.guardian_battery_modul_1_zelle_1_tiefbereich_lowest') %}\n{% set low_rank = states('sensor.guardian_battery_modul_1_zelle_1_tiefbereich_mittlerer_rang') %}\n{% set low_n = states('sensor.guardian_battery_modul_1_zelle_1_tiefbereich_messpunkte') %}\n{% set dsg_dev = states('sensor.guardian_battery_modul_1_zelle_1_entladung_abweichung') %}\n{% set dsg_lowest = states('sensor.guardian_battery_modul_1_zelle_1_entladung_lowest') %}\n{% set dsg_rank = states('sensor.guardian_battery_modul_1_zelle_1_entladung_mittlerer_rang') %}\n{% set dsg_n = states('sensor.guardian_battery_modul_1_zelle_1_entladung_messpunkte') %}\n{% set chg_dev = states('sensor.guardian_battery_modul_1_zelle_1_ladung_abweichung') %}\n{% set chg_rank = states('sensor.guardian_battery_modul_1_zelle_1_ladung_mittlerer_rang') %}\n{% set chg_highest = states('sensor.guardian_battery_modul_1_zelle_1_ladung_highest')\
      \ %}\n{% set chg_n = states('sensor.guardian_battery_modul_1_zelle_1_ladung_messpunkte') %}\n{% set high_dev = states('sensor.guardian_battery_modul_1_zelle_1_hochbereich_abweichung') %}\n{% set high_rank = states('sensor.guardian_battery_modul_1_zelle_1_hochbereich_mittlerer_rang') %}\n{% set high_highest = states('sensor.guardian_battery_modul_1_zelle_1_hochbereich_highest') %}\n{% set high_n = states('sensor.guardian_battery_modul_1_zelle_1_hochbereich_messpunkte') %}\n\n### Tiefbereich\n\n**Medianabweichung:** {{ low_dev }} mV  \n**Lowest-Anteil:** {{ low_lowest }} %  \n**Mittlerer Rang:** {{ low_rank }} von 15  \n**Gültige Messpunkte:** {{ low_n }}\n\n---\n\n### Entladung\n\n**Medianabweichung:** {{ dsg_dev }} mV  \n**Lowest-Anteil:** {{ dsg_lowest }} %  \n**Mittlerer Rang:** {{ dsg_rank }} von 15  \n**Gültige Messpunkte:** {{ dsg_n }}\n\n---\n\n### Ladung\n\n**Medianabweichung:** {{ chg_dev }} mV  \n**Highest-Anteil:** {{ chg_highest }} %  \n**Mittlerer Rang:** {{ chg_rank }}\
      \ von 15  \n**Gültige Messpunkte:** {{ chg_n }}\n\n---\n\n### Hochbereich\n\n**Medianabweichung:** {{ high_dev }} mV  \n**Highest-Anteil:** {{ high_highest }} %  \n**Mittlerer Rang:** {{ high_rank }} von 15  \n**Gültige Messpunkte:** {{ high_n }}\n\n---\n\n**Interpretation**  \nLowest-/Highest-Anteil und Rang sind relative Kennwerte.  \nBewertet werden sie zusammen mit der Abweichung **[mV]**, der Zahl gültiger Messpunkte, Persistenz und Confidence.\n"
  - type: markdown
    title: ⓘ Parameter erklären
    content: "**Medianabweichung [mV]**  \nΔVᵢ = Vᵢ − Median(V₁…V₁₅). Negative Werte liegen unter, positive über dem Modulmedian. Die Bedeutung ist von der Betriebsphase abhängig.\n\n**Lowest-/Highest-Anteil [%]**  \nAnteil gültiger Messpunkte einer Phase, in denen die Zelle die niedrigste bzw. höchste Spannung im Modul hatte. **100 % allein bedeutet keinen Defekt.**\n\n**Mittlerer Rang [Rang von 15]**  \nRang 1 = höchste, Rang 15 = niedrigste Zellspannung. Der Rang ist relativ und besitzt keine physikalische Einheit.\n\n**Gültige Messpunkte [Messpunkte]**  \nZahl der Messwerte, die Guardian der jeweiligen Phase zugeordnet hat. Wenige Messpunkte bedeuten geringere Evidenz.\n\n**Confidence [dimensionslos]**  \nLOW / MEDIUM / HIGH beschreibt die Belastbarkeit des Befunds aus Datenmenge und Reproduzierbarkeit; sie ist kein Gesundheitswert.\n\n**Quelle:** Zellspannungen aus Pylontech `bat <module>`; Phasenkennwerte und Evidenz werden von Guardian berechnet.\n"
  - type: markdown
    content: '**Zeitverlauf ΔV [mV]:** Zellspannung minus Modulmedian.   **0 mV** = exakt auf Modulmedian. Negative Werte = darunter, positive = darüber.   Die Kurve enthält zeitlich aufeinanderfolgende Betriebsphasen; für die Diagnose ist deshalb die **Phasenübersicht oben maßgeblich**.'
  - type: history-graph
    title: Zelle 1 · ΔV zum Modulmedian [mV] · 7 Tage
    hours_to_show: 168
    entities:
    - sensor.guardian_battery_modul_1_zelle_1_abweichung
  - type: history-graph
    title: Zelle 1 · Zellspannung + Modulmedian [mV] · 24 Stunden
    hours_to_show: 24
    entities:
    - sensor.guardian_battery_modul_1_zelle_1_spannung
    - sensor.guardian_battery_modul_1_zellmedian
  - type: markdown
    title: Methodischer Hinweis
    content: '**Bewertung:** phase-resolved Cell Voltage Consistency.   Die Zellspannung wird relativ zum Median der 15 Zellen desselben Moduls ausgewertet. Tiefbereich, Entladung, Ladung und Hochbereich werden getrennt betrachtet.

      **Nicht zulässig:** Aus einer einzelnen niedrigen oder hohen Zellspannung direkt auf Kapazitätsverlust oder erhöhten Innenwiderstand zu schließen. Diese Aussagen werden erst aktiviert, wenn die dafür vorgesehenen Diagnoseverfahren ausreichend validiert sind.'
