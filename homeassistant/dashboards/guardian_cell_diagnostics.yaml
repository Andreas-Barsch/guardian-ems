  - type: markdown
    title: ⓘ Parameter erklären
    content: "**Medianabweichung [mV]**  \nΔVᵢ = Vᵢ − Median(V₁…V₁₅). Negative Werte liegen unter, positive über dem Modulmedian. Die Bedeutung ist von der Betriebsphase abhängig.\n\n**Lowest-/Highest-Anteil [%]**  \nAnteil gültiger Messpunkte einer Phase, in denen die Zelle die niedrigste bzw. höchste Spannung im Modul hatte. **100 % allein bedeutet keinen Defekt.**\n\n**Mittlerer Rang [Rang von 15]**  \nRang 1 = höchste, Rang 15 = niedrigste Zellspannung. Der Rang ist relativ und besitzt keine physikalische Einheit.\n\n**Gültige Messpunkte [Messpunkte]**  \nZahl der Messwerte, die Guardian der jeweiligen Phase zugeordnet hat. Wenige Messpunkte bedeuten geringere Evidenz.\n\n**Confidence [dimensionslos]**  \nLOW / MEDIUM / HIGH beschreibt die Belastbarkeit des Befunds aus Datenmenge und Reproduzierbarkeit; sie ist kein Gesundheitswert.\n\n**Quelle:** Zellspannungen aus Pylontech `bat <module>`; Phasenkennwerte und Evidenz werden von Guardian berechnet.\n"
  - type: markdown
    content: '**Zeitverlauf ΔV [mV]:** Zellspannung minus Modulmedian.   **0 mV** = exakt auf Modulmedian. Negative Werte = darunter, positive = darüber.   Die Kurve enthält zeitlich aufeinanderfolgende Betriebsphasen; für die Diagnose ist deshalb die **Phasenübersicht oben maßgeblich**.'
